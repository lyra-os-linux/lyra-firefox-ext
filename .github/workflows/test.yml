name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extension-and-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx web-ext lint --source-dir theme/static --self-hosted
      - run: bash -n theme/scripts/sign.sh
